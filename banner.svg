<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="Reza Sarkhosh — Physics-Informed Machine Learning for Water Resilience">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05141f"/>
      <stop offset="0.55" stop-color="#0a3242"/>
      <stop offset="1" stop-color="#0d5560"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.38" r="0.45">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1280" height="380" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .math { font-family: 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', 'Times New Roman', serif; font-style: italic; }
    .w1 { animation: right 16s linear infinite; }
    .w2 { animation: left 22s linear infinite; }
    .w3 { animation: right 28s linear infinite; }
    @keyframes right { from { transform: translateX(0); } to { transform: translateX(320px); } }
    @keyframes left  { from { transform: translateX(0); } to { transform: translateX(-320px); } }
    .pt { animation: pulse 4s ease-in-out infinite; }
    .d1 { animation-delay: -1s; } .d2 { animation-delay: -2s; } .d3 { animation-delay: -3s; }
    @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
    .edge { stroke: #5eead4; stroke-opacity: 0.22; stroke-width: 1; }
    .node { fill: #0a3242; stroke: #5eead4; stroke-width: 1.6; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="380" fill="url(#bg)"/>
    <rect width="1280" height="380" fill="url(#glow)"/>

    <!-- collocation points -->
    <g fill="#99f6e4">
      <circle class="pt" cx="842" cy="58" r="2"/>
      <circle class="pt d1" cx="884" cy="214" r="1.8"/>
      <circle class="pt d2" cx="948" cy="42" r="2.2"/>
      <circle class="pt d3" cx="1036" cy="238" r="1.8"/>
      <circle class="pt" cx="1128" cy="46" r="2"/>
      <circle class="pt d1" cx="1222" cy="88" r="2.2"/>
      <circle class="pt d2" cx="1238" cy="204" r="1.8"/>
      <circle class="pt d3" cx="1144" cy="232" r="2"/>
      <circle class="pt" cx="1236" cy="268" r="1.6"/>
      <circle class="pt d2" cx="1214" cy="186" r="1.6"/>
      <circle class="pt d1" cx="826" cy="140" r="1.6"/>
      <circle class="pt d3" cx="1036" cy="34" r="1.6"/>
      <circle class="pt d1" cx="720" cy="44" r="1.4"/>
      <circle class="pt d3" cx="640" cy="70" r="1.4"/>
    </g>

    <!-- network u_theta(x, t) -->
    <g class="edge">
      <line x1="910" y1="115" x2="990" y2="70"/><line x1="910" y1="115" x2="990" y2="115"/>
      <line x1="910" y1="115" x2="990" y2="160"/><line x1="910" y1="115" x2="990" y2="205"/>
      <line x1="910" y1="160" x2="990" y2="70"/><line x1="910" y1="160" x2="990" y2="115"/>
      <line x1="910" y1="160" x2="990" y2="160"/><line x1="910" y1="160" x2="990" y2="205"/>

      <line x1="990" y1="70" x2="1080" y2="70"/><line x1="990" y1="70" x2="1080" y2="115"/>
      <line x1="990" y1="70" x2="1080" y2="160"/><line x1="990" y1="70" x2="1080" y2="205"/>
      <line x1="990" y1="115" x2="1080" y2="70"/><line x1="990" y1="115" x2="1080" y2="115"/>
      <line x1="990" y1="115" x2="1080" y2="160"/><line x1="990" y1="115" x2="1080" y2="205"/>
      <line x1="990" y1="160" x2="1080" y2="70"/><line x1="990" y1="160" x2="1080" y2="115"/>
      <line x1="990" y1="160" x2="1080" y2="160"/><line x1="990" y1="160" x2="1080" y2="205"/>
      <line x1="990" y1="205" x2="1080" y2="70"/><line x1="990" y1="205" x2="1080" y2="115"/>
      <line x1="990" y1="205" x2="1080" y2="160"/><line x1="990" y1="205" x2="1080" y2="205"/>

      <line x1="1080" y1="70" x2="1160" y2="137.5"/><line x1="1080" y1="115" x2="1160" y2="137.5"/>
      <line x1="1080" y1="160" x2="1160" y2="137.5"/><line x1="1080" y1="205" x2="1160" y2="137.5"/>
    </g>
    <g class="node">
      <circle cx="910" cy="115" r="7"/><circle cx="910" cy="160" r="7"/>
      <circle cx="990" cy="70" r="7"/><circle cx="990" cy="115" r="7"/>
      <circle cx="990" cy="160" r="7"/><circle cx="990" cy="205" r="7"/>
      <circle cx="1080" cy="70" r="7"/><circle cx="1080" cy="115" r="7"/>
      <circle cx="1080" cy="160" r="7"/><circle cx="1080" cy="205" r="7"/>
    </g>
    <circle cx="1160" cy="137.5" r="9" fill="#2dd4bf"/>
    <g class="math" fill="#ccfbf1" font-size="18">
      <text x="886" y="121" text-anchor="end">x</text>
      <text x="886" y="166" text-anchor="end">t</text>
      <text x="1178" y="143">c(x, t)</text>
    </g>

    <!-- governing equation + PINN loss -->
    <g class="math" fill="#ccfbf1">
      <text x="868" y="270" font-size="23" opacity="0.95">∂c/∂t + u · ∇c = D ∇<tspan font-size="15" dy="-10">2</tspan><tspan dy="10">c</tspan></text>
      <text x="868" y="302" font-size="19" opacity="0.7">ℒ = ℒ<tspan font-size="13" dy="4">data</tspan><tspan dy="-4"> + λ · ℒ</tspan><tspan font-size="13" dy="4">physics</tspan></text>
    </g>

    <!-- text block -->
    <rect x="64" y="104" width="52" height="4" rx="2" fill="#2dd4bf"/>
    <text class="sans" x="64" y="170" font-size="60" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Reza Sarkhosh</text>
    <text class="sans" x="64" y="214" font-size="25" font-weight="500" fill="#5eead4">Physics-Informed Machine Learning for Water Resilience</text>
    <text class="sans" x="64" y="252" font-size="18" fill="#cbd5e1">PhD Researcher · DCU Water Institute · Dublin, Ireland</text>
    <text class="sans" x="64" y="290" font-size="14" fill="#94a3b8" letter-spacing="2">PINNs  ·  SCIENTIFIC ML  ·  FEDERATED LEARNING  ·  DIGITAL TWINS</text>

    <!-- water -->
    <path class="w1" fill="#2dd4bf" fill-opacity="0.10" d="M-320 326 q80 -22 160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 L1600 380 L-320 380 Z"/>
    <path class="w2" fill="#14b8a6" fill-opacity="0.16" d="M-320 340 q80 -16 160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 L1600 380 L-320 380 Z"/>
    <path class="w3" fill="#0f766e" fill-opacity="0.35" d="M-320 354 q80 -12 160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 t160 0 L1600 380 L-320 380 Z"/>
  </g>
</svg>
